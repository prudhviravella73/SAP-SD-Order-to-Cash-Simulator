<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAP SD Order-to-Cash Simulator</title>
<style>
  :root{
    --blue-90:#0a3d6e;
    --blue-70:#0854a0;
    --blue-50:#0a6ed1;
    --blue-20:#d1e8ff;
    --blue-10:#eef6ff;
    --ink-90:#1a2733;
    --ink-70:#3c4c5c;
    --ink-50:#6b7c8c;
    --ink-30:#a6b4c0;
    --line:#dde3e9;
    --bg:#f4f6f8;
    --card:#ffffff;
    --green:#1a7f4e;
    --green-bg:#e6f5ec;
    --amber:#a85d00;
    --amber-bg:#fdf1e0;
    --red:#b3261e;
    --red-bg:#fbe9e8;
    --grey-bg:#eceff2;
    --radius:6px;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink-90);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;height:100vh;overflow:hidden}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:220px;flex-shrink:0;background:var(--blue-90);
    color:#dce9f5;display:flex;flex-direction:column;
    overflow-y:auto;
  }
  #sidebar .brand{
    padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,0.12);
  }
  #sidebar .brand .t1{font-size:12px;letter-spacing:.04em;color:#8fb7dd;font-weight:600}
  #sidebar .brand .t2{font-size:16px;font-weight:700;color:#fff;margin-top:2px}
  #sidebar nav{padding:10px 0;flex:1}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 16px;cursor:pointer;color:#cfe0f0;
    font-size:13.5px;border-left:3px solid transparent;
    user-select:none;
  }
  .nav-item .ic{width:18px;text-align:center;font-size:14px;opacity:.9}
  .nav-item:hover{background:rgba(255,255,255,0.06);color:#fff}
  .nav-item.active{background:rgba(255,255,255,0.12);color:#fff;border-left-color:#5aa9f2;font-weight:600}
  .nav-sec{padding:14px 16px 4px;font-size:10.5px;letter-spacing:.06em;color:#6f93b5;text-transform:uppercase}

  /* ---------- Main ---------- */
  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  #topbar{
    height:56px;background:var(--card);border-bottom:1px solid var(--line);
    display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0;
  }
  #topbar .app-title{font-weight:700;font-size:15px;color:var(--ink-90)}
  #topbar .search-wrap{flex:1;max-width:420px;position:relative}
  #topbar input.gsearch{
    width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:var(--radius);
    font-size:13px;background:var(--bg);
  }
  #topbar input.gsearch:focus{outline:none;border-color:var(--blue-50);background:#fff}
  #topbar .search-wrap::before{
    content:'⌕';position:absolute;left:11px;top:6px;color:var(--ink-50);font-size:15px;
  }
  #topbar .spacer{flex:1}
  #topbar .icon-btn{
    width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--ink-70);cursor:pointer;font-size:15px;position:relative;
  }
  #topbar .icon-btn:hover{background:var(--bg)}
  #topbar .user-chip{
    display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:20px;cursor:default;
  }
  #topbar .avatar{width:26px;height:26px;border-radius:50%;background:var(--blue-50);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  #content{flex:1;overflow-y:auto;padding:22px 26px}

  .crumbs{font-size:12px;color:var(--ink-50);margin-bottom:6px}
  .crumbs span.cur{color:var(--ink-90);font-weight:600}
  h1.page-title{font-size:20px;margin:0 0 4px;color:var(--ink-90)}
  .page-sub{color:var(--ink-50);font-size:13px;margin-bottom:18px}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);
    font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink-70);
    cursor:pointer;white-space:nowrap;
  }
  .btn:hover{background:var(--bg)}
  .btn.primary{background:var(--blue-50);border-color:var(--blue-50);color:#fff}
  .btn.primary:hover{background:var(--blue-70)}
  .btn.danger{color:var(--red);border-color:#f0c9c7}
  .btn.danger:hover{background:var(--red-bg)}
  .btn.small{padding:5px 10px;font-size:12px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-link{background:none;border:none;color:var(--blue-50);font-weight:600;cursor:pointer;padding:0;font-size:13px}
  .btn-link:hover{text-decoration:underline}

  /* ---------- Cards / KPI ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer}
  .kpi:hover{border-color:var(--blue-50)}
  .kpi .v{font-size:24px;font-weight:700;color:var(--ink-90)}
  .kpi .l{font-size:12px;color:var(--ink-50);margin-top:2px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  .card h3{margin:0 0 12px;font-size:14px;color:var(--ink-90)}

  /* ---------- Pipeline ---------- */
  .pipeline{display:flex;flex-wrap:wrap;gap:0;align-items:center}
  .pipe-stage{
    background:var(--blue-10);border:1px solid var(--blue-20);color:var(--blue-70);
    padding:9px 14px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .pipe-stage:hover{background:var(--blue-20)}
  .pipe-arrow{color:var(--ink-30);padding:0 8px;font-size:14px}

  /* ---------- Tables ---------- */
  .table-toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .table-toolbar input[type=text], .table-toolbar select{
    padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:13px;background:#fff;
  }
  /* ---------- Customer Master Search ---------- */
  .customer-search-toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .customer-search-box{
    position:relative;
    width:min(420px,100%);
    display:flex;
    align-items:center;
  }
  .customer-search-box #cust-search,
  .customer-search-box #mat-search{
    width:100%;
    height:38px;
    padding:8px 38px 8px 34px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink-90);
    font-size:13px;
    transition:border-color .15s, box-shadow .15s;
    box-sizing:border-box;
  }
  .customer-search-box #cust-search:focus,
  .customer-search-box #mat-search:focus{
    outline:none;
    border-color:var(--blue-50);
    box-shadow:0 0 0 3px rgba(10,110,209,.10);
  }
  .customer-search-icon{
    position:absolute;
    left:11px;
    z-index:1;
    color:var(--ink-50);
    font-size:16px;
    pointer-events:none;
  }
  .customer-clear-btn{
    position:absolute;
    right:7px;
    width:25px;
    height:25px;
    border:0;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    background:var(--grey-bg);
    color:var(--ink-70);
    cursor:pointer;
    font-size:18px;
    line-height:1;
    padding:0;
  }
  .customer-clear-btn:hover{
    background:var(--blue-20);
    color:var(--blue-70);
  }
  .customer-search-box.has-value .customer-clear-btn{
    display:flex;
  }
  .customer-filter{
    height:38px;
    min-width:145px;
    padding:7px 34px 7px 11px !important;
    border-radius:8px !important;
    background:#fff;
  }
  table.grid{width:100%;border-collapse:collapse;font-size:13px}
  table.grid thead th{
    text-align:left;padding:9px 12px;background:var(--bg);color:var(--ink-50);
    font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;border-bottom:1px solid var(--line);
    cursor:pointer;white-space:nowrap;
  }
  table.grid thead th:hover{color:var(--ink-90)}
  table.grid tbody td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink-90);white-space:nowrap}
  table.grid tbody tr:hover{background:var(--blue-10)}
  .cell-link{color:var(--blue-50);font-weight:600;cursor:pointer}
  .cell-link:hover{text-decoration:underline}
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
  .table-wrap table.grid{border:none}
  .table-wrap thead th:first-child{border-top-left-radius:var(--radius)}

  .badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11.5px;font-weight:600}
  .badge.grey{background:var(--grey-bg);color:var(--ink-70)}
  .badge.blue{background:var(--blue-20);color:var(--blue-70)}
  .badge.green{background:var(--green-bg);color:var(--green)}
  .badge.amber{background:var(--amber-bg);color:var(--amber)}
  .badge.red{background:var(--red-bg);color:var(--red)}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-50)}
  .empty-state .ic{font-size:34px;margin-bottom:10px}
  .empty-state .msg{font-size:13.5px;margin-bottom:14px}

  /* ---------- Forms ---------- */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
  .form-grid.one{grid-template-columns:1fr}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;font-weight:600;color:var(--ink-70)}
  .field label .req{color:var(--red)}
  .field input, .field select, .field textarea{
    padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:13px;
    font-family:inherit;background:#fff;color:var(--ink-90);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--blue-50)}
  .field .err{color:var(--red);font-size:11.5px}
  .field-note{font-size:11.5px;color:var(--ink-50)}
  fieldset.fgroup{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 16px;margin:0 0 4px}
  fieldset.fgroup legend{font-size:12px;font-weight:700;color:var(--blue-70);padding:0 6px}

  /* ---------- Modal ---------- */
  #modal-backdrop{
    position:fixed;inset:0;background:rgba(20,30,40,0.45);display:none;
    align-items:flex-start;justify-content:center;z-index:1000;padding:40px 16px;overflow-y:auto;
  }
  #modal-backdrop.show{display:flex}
  .modal{background:#fff;border-radius:8px;width:100%;max-width:640px;box-shadow:0 12px 40px rgba(0,0,0,0.2)}
  .modal.wide{max-width:820px}
  .modal .m-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal .m-head h2{margin:0;font-size:16px}
  .modal .m-close{cursor:pointer;color:var(--ink-50);font-size:20px;line-height:1;padding:2px 6px}
  .modal .m-close:hover{color:var(--ink-90)}
  .modal .m-body{padding:20px;max-height:65vh;overflow-y:auto}
  .modal .m-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

  /* ---------- Toast ---------- */
  #toast-wrap{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
  .toast{
    background:#1a2733;color:#fff;padding:11px 16px;border-radius:var(--radius);font-size:13px;
    min-width:260px;max-width:380px;box-shadow:0 6px 20px rgba(0,0,0,0.25);
    display:flex;align-items:flex-start;gap:9px;
  }
  .toast.success{background:#14532d}
  .toast.error{background:#6e1a15}
  .toast .ic{font-size:15px;margin-top:1px}

  /* ---------- Doc detail ---------- */
  .kv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:6px}
  .kv .l{font-size:11px;color:var(--ink-50);text-transform:uppercase;letter-spacing:.02em}
  .kv .v{font-size:13.5px;color:var(--ink-90);font-weight:600;margin-top:2px}
  .kv .v.mono{font-family:var(--mono)}

  .flow-chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;margin:8px 0 4px}
  .flow-node{
    border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:10px 14px;min-width:150px;
    cursor:pointer;
  }
  .flow-node:hover{border-color:var(--blue-50)}
  .flow-node .fn-t{font-size:10.5px;text-transform:uppercase;color:var(--ink-50);letter-spacing:.03em}
  .flow-node .fn-id{font-weight:700;font-family:var(--mono);font-size:13px;margin-top:2px;color:var(--blue-70)}
  .flow-node .fn-s{margin-top:6px}
  .flow-node.empty{opacity:.45;cursor:default}
  .flow-node.empty:hover{border-color:var(--line)}
  .flow-arrow-v{display:flex;align-items:center;justify-content:center;color:var(--ink-30);width:26px;font-size:15px}

  .section-title{font-size:13px;font-weight:700;color:var(--ink-90);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .section-title:first-child{margin-top:0}
  .muted{color:var(--ink-50)}
  .right{text-align:right}
  .mono{font-family:var(--mono)}
  .stat-line{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px dashed var(--line)}
  .stat-line:last-child{border-bottom:none}
  .stat-line .l{color:var(--ink-50)}
  .stat-line .v{font-weight:700}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .bar-row .name{width:130px;font-size:12.5px;color:var(--ink-70);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-track{flex:1;background:var(--grey-bg);border-radius:4px;height:14px;overflow:hidden}
  .bar-fill{background:var(--blue-50);height:100%;border-radius:4px}
  .bar-val{width:90px;text-align:right;font-size:12px;color:var(--ink-70);flex-shrink:0}

  .banner{padding:11px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
  .banner.info{background:var(--blue-10);color:var(--blue-70)}
  .banner.warn{background:var(--amber-bg);color:var(--amber)}
  .banner.error{background:var(--red-bg);color:var(--red)}

  @media print{
    #sidebar,#topbar,.no-print{display:none!important}
    #content{overflow:visible;padding:0}
    body{background:#fff}
  }
  @media (max-width:900px){
    .form-grid{grid-template-columns:1fr}
    #sidebar{width:60px}
    #sidebar .brand .t2, #sidebar .nav-item span.label, .nav-sec{display:none}
    #sidebar .nav-item{justify-content:center}
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="brand">
      <div class="t1">SAP S/4HANA · SD</div>
      <div class="t2">O2C Simulator</div>
    </div>
    <nav id="nav"></nav>
  </div>
  <div id="main">
    <div id="topbar">
      <div class="app-title">Order-to-Cash</div>
      <div class="search-wrap">
        <input class="gsearch" id="gsearch" type="text" placeholder="Search customer, material, order, invoice...">
      </div>
      <div class="spacer"></div>
      <div class="user-chip"><div class="avatar">SD</div><span style="font-size:13px;color:var(--ink-70)">Sales User</span></div>
    </div>
    <div id="content"></div>
  </div>
</div>
<div id="modal-backdrop"><div class="modal" id="modal"></div></div>
<div id="toast-wrap"></div>

<script>
/* =========================================================================
   SAP SD ORDER-TO-CASH SIMULATOR
   Single-file app: state, persistence, rendering, business logic
   ========================================================================= */

const STORAGE_KEY = 'sd_o2c_db_v1';

let DB = null; // loaded async at boot
let VIEW = { name: 'dashboard', params: {} };
let NAV_STACK = [];
let SEARCH_INDEX = [];

/* ---------------- Persistence ---------------- */
async function loadDB(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      return JSON.parse(res.value);
    }
  }catch(e){ /* not found or storage unavailable */ }
  return null;
}
let saveTimer = null;
function saveDB(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(DB), false); }
    catch(e){ console.error('save failed', e); }
  }, 150);
}

function emptyDB(){
  return {
    counters:{ cust:100000, mat:100000, inq:100000, qt:100000, so:100000, del:100000, matdoc:100000, inv:100000, pay:100000 },
    customers:[], materials:[], inquiries:[], quotations:[], salesOrders:[], deliveries:[], materialDocs:[], invoices:[], payments:[],
    demoLoaded:false
  };
}
function nextId(prefix, key){ DB.counters[key]++; return prefix+'-'+DB.counters[key]; }

/* ---------------- Utilities ---------------- */
function fmtMoney(n, cur){
  cur = cur || 'INR';
  const symbol = cur==='INR' ? '₹' : (cur==='USD'?'$':(cur==='EUR'?'€':cur+' '));
  const v = Number(n||0);
  return symbol + v.toLocaleString('en-IN', {maximumFractionDigits:2, minimumFractionDigits:2});
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtDateTime(d){
  if(!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) + ' ' + dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function todayISO(){ return new Date().toISOString(); }
function addDays(dateStr, days){
  const d = new Date(dateStr); d.setDate(d.getDate()+days); return d.toISOString();
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }

function toast(msg, type){
  type = type || 'info';
  const icon = type==='success' ? '✓' : (type==='error' ? '✕' : 'ℹ');
  const t = el(`<div class="toast ${type}"><span class="ic">${icon}</span><span>${escapeHtml(msg)}</span></div>`);
  document.getElementById('toast-wrap').appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 3200);
}

function openModal(title, bodyHtml, footButtons, wide){
  const backdrop = document.getElementById('modal-backdrop');
  const modal = document.getElementById('modal');
  modal.className = 'modal' + (wide?' wide':'');
  modal.innerHTML = `
    <div class="m-head"><h2>${title}</h2><div class="m-close" id="m-close-btn">×</div></div>
    <div class="m-body" id="m-body">${bodyHtml}</div>
    <div class="m-foot" id="m-foot"></div>`;
  const foot = modal.querySelector('#m-foot');
  (footButtons||[]).forEach(b=>{
    const btn = el(`<button class="btn ${b.cls||''}">${b.label}</button>`);
    btn.addEventListener('click', b.onClick);
    foot.appendChild(btn);
  });
  backdrop.classList.add('show');
  modal.querySelector('#m-close-btn').addEventListener('click', closeModal);
  backdrop.onclick = (e)=>{ if(e.target===backdrop) closeModal(); };
}
function closeModal(){ document.getElementById('modal-backdrop').classList.remove('show'); }

function confirmDialog(message, onConfirm, opts){
  opts = opts || {};
  openModal(opts.title || 'Please confirm', `<p style="margin:0;font-size:13.5px;color:var(--ink-90)">${escapeHtml(message)}</p>`, [
    {label:'Cancel', cls:'', onClick: closeModal},
    {label: opts.confirmLabel || 'Confirm', cls:'primary', onClick: ()=>{ closeModal(); onConfirm(); }}
  ]);
}

function badge(text, color){ return `<span class="badge ${color}">${escapeHtml(text)}</span>`; }

const STATUS_COLORS = {
  // generic
  'Open':'blue','Draft':'grey','Active':'blue','Processed':'blue','Rejected':'red','Expired':'grey',
  'Accepted':'green','Converted to Quotation':'green','Converted to Sales Order':'green',
  'Created':'blue','Confirmed':'blue','Partially Delivered':'amber','Fully Delivered':'green',
  'Billing Created':'blue','Paid':'green','Completed':'green','Cancelled':'red',
  'Not Created':'grey','Picking':'amber','Picked':'amber','PGI Completed':'green',
  'Partially Paid':'amber','Overdue':'red'
};
function statusBadge(s){ return badge(s, STATUS_COLORS[s] || 'grey'); }

/* ---------------- Reference data ---------------- */
const SALES_ORGS = ['1000 - Sales Org India','2000 - Sales Org Export'];
const DIST_CHANNELS = ['10 - Direct Sales','20 - Retail','30 - Online'];
const DIVISIONS = ['00 - Cross Division','01 - Electronics','02 - Furniture'];
const SALES_OFFICES = ['HYD1 - Hyderabad Office','MUM1 - Mumbai Office','BLR1 - Bengaluru Office'];
const SALES_GROUPS = ['G1 - Corporate Sales','G2 - Channel Sales'];
const PAYMENT_TERMS = [
  {code:'Z000', label:'Immediate Payment', days:0},
  {code:'Z007', label:'Net 7', days:7},
  {code:'Z015', label:'Net 15', days:15},

function termDays(code){ const t=PAYMENT_TERMS.find(t=>t.code===code); return t?t.days:30; }
function termLabel(code){ const t=PAYMENT_TERMS.find(t=>t.code===code); return t?`${t.code} - ${t.label}`:code; }

   BUSINESS LOGIC
   ========================================================================= */

function addAudit(doc, action){
  doc.audit = doc.audit || [];
  doc.audit.push({action, at: todayISO(), by:'Sales User'});
}

function findCustomer(id){ return DB.customers.find(c=>c.id===id); }
function findMaterial(id){ return DB.materials.find(m=>m.id===id); }

function createCustomer(data){
  const id = nextId('CUST','cust');
  const c = Object.assign({id, active:true, createdAt: todayISO(), createdBy:'Sales User'}, data);
  DB.customers.push(c); saveDB(); return c;
}
function updateCustomer(id, data){
  const c = findCustomer(id); if(!c) return null;
  Object.assign(c, data); c.modifiedAt = todayISO(); saveDB(); return c;
}
function toggleCustomerActive(id){
  const c = findCustomer(id); if(!c) return;
  c.active = !c.active; c.modifiedAt = todayISO(); saveDB();
}

function createMaterial(data){
  const id = nextId('MAT','mat');
  const m = Object.assign({id, createdAt: todayISO()}, data);
  DB.materials.push(m); saveDB(); return m;
}
function updateMaterial(id, data){
  const m = findMaterial(id); if(!m) return null;
  Object.assign(m, data); m.modifiedAt = todayISO(); saveDB(); return m;
}

function createInquiry(data){
  const id = nextId('INQ','inq');
  const inq = Object.assign({id, status:'Open', createdAt: todayISO()}, data);
  addAudit(inq, 'Created');
  DB.inquiries.push(inq); saveDB(); return inq;
}
function convertInquiryToQuotation(inqId, extra){
  const inq = DB.inquiries.find(i=>i.id===inqId); if(!inq) return null;
  const mat = findMaterial(inq.materialId);
  const price = extra.unitPrice != null ? extra.unitPrice : (mat ? mat.standardPrice : 0);
  const qt = createQuotation(Object.assign({
    customerId: inq.customerId, inquiryId: inq.id, materialId: inq.materialId,
    quantity: inq.quantity, unitPrice: price, discountPct: 0, taxPct: 18,
    currency:'INR', paymentTerms:'Z030', incoterms: INCOTERMS[0]
  }, extra));
  inq.status = 'Converted to Quotation';
  addAudit(inq, 'Converted to Quotation ' + qt.id);
  saveDB();
  return qt;
}

function calcLine(qty, unitPrice, discountPct, taxPct){
  const gross = qty * unitPrice;
  const discount = gross * (discountPct/100);
  const afterDiscount = gross - discount;
  const tax = afterDiscount * (taxPct/100);
  const net = afterDiscount + tax;
  return {gross, discount, tax, net};
}

function createQuotation(data){
  const id = nextId('QT','qt');
  const calc = calcLine(data.quantity, data.unitPrice, data.discountPct||0, data.taxPct||0);
  const qt = Object.assign({
    id, status:'Draft', createdAt: todayISO(),
    validFrom: todayISO(), validTo: addDays(todayISO(), 30)
  }, data, calc);
  addAudit(qt, 'Created');
  DB.quotations.push(qt); saveDB(); return qt;
}
function setQuotationStatus(id, status){
  const qt = DB.quotations.find(q=>q.id===id); if(!qt) return;
  qt.status = status; addAudit(qt, 'Status -> '+status); saveDB();
}

function convertQuotationToSalesOrder(qtId, extra){
  const qt = DB.quotations.find(q=>q.id===qtId); if(!qt) return null;
  const so = createSalesOrder(Object.assign({
    customerId: qt.customerId, quotationId: qt.id, materialId: qt.materialId,
    quantity: qt.quantity, unitPrice: qt.unitPrice, discountPct: qt.discountPct, taxPct: qt.taxPct,
    currency: qt.currency, paymentTerms: qt.paymentTerms, incoterms: qt.incoterms,
  }, extra));
  qt.status = 'Converted to Sales Order';
  addAudit(qt, 'Converted to Sales Order '+so.id);
  saveDB();
  return so;
}

function createSalesOrder(data){
  const id = nextId('SO','so');
  const calc = calcLine(data.quantity, data.unitPrice, data.discountPct||0, data.taxPct||0);
  const mat = findMaterial(data.materialId);
  const so = Object.assign({
    id, status:'Created', createdAt: todayISO(),
    salesOrg: SALES_ORGS[0], distChannel: DIST_CHANNELS[0], division: DIVISIONS[0],
    salesOffice: SALES_OFFICES[0], salesGroup: SALES_GROUPS[0],
    plant: mat ? mat.plant : PLANTS[0], storageLoc: mat ? mat.storageLoc : STORAGE_LOCS[0],
    requestedDeliveryDate: addDays(todayISO(), 5),
  }, data, calc);
  addAudit(so, 'Created');
  DB.salesOrders.push(so); saveDB();
  performAvailabilityCheck(so.id);
  return so;
}

function performAvailabilityCheck(soId){
  const so = DB.salesOrders.find(s=>s.id===soId); if(!so) return;
  const mat = findMaterial(so.materialId);
  const available = mat ? mat.stock : 0;
  const confirmedQty = Math.min(so.quantity, available);
  const backorder = so.quantity - confirmedQty;
  so.availabilityCheck = {
    requestedQty: so.quantity, availableStock: available,
    confirmedQty, backorderQty: backorder,
    confirmedDeliveryDate: backorder>0 ? addDays(todayISO(), 12) : so.requestedDeliveryDate,
    checkedAt: todayISO()
  };
  so.confirmedQty = confirmedQty;
  so.status = 'Confirmed';
  addAudit(so, `Availability check: confirmed ${confirmedQty}/${so.quantity}`);
  saveDB();
}

function deliveryEligible(so){
  return ['Confirmed','Partially Delivered'].includes(so.status) && (so.confirmedQty - deliveredQtyForSO(so.id)) > 0;
}
function deliveredQtyForSO(soId){
  return DB.deliveries.filter(d=>d.salesOrderId===soId).reduce((sum,d)=>sum+d.quantity,0);
}

function createDelivery(soId, qty){
  const so = DB.salesOrders.find(s=>s.id===soId);
  if(!so) return {error:'Sales order not found.'};
  if(!['Confirmed','Partially Delivered'].includes(so.status)) return {error:'Delivery cannot be created because the Sales Order is not confirmed.'};
  const remaining = so.confirmedQty - deliveredQtyForSO(so.id);
  if(qty <= 0) return {error:'Delivery quantity must be greater than zero.'};
  if(qty > remaining) return {error:`Delivery quantity exceeds confirmed remaining quantity (${remaining}).`};
  const id = nextId('DEL','del');
  const del = {
    id, salesOrderId: so.id, customerId: so.customerId, materialId: so.materialId,
    quantity: qty, deliveryDate: todayISO(), shippingPoint:'SP01 - Hyderabad Shipping Point',
    plant: so.plant, storageLoc: so.storageLoc,
    pickedQty: 0, pickingStatus:'Not Started', status:'Created', pgiStatus:'Pending',
    createdAt: todayISO()
  };
  addAudit(del, 'Created');
  DB.deliveries.push(del);
  const totalDelivered = deliveredQtyForSO(so.id) + qty;
  so.status = totalDelivered >= so.confirmedQty ? 'Fully Delivered' : 'Partially Delivered';
  addAudit(so, 'Delivery '+id+' created for qty '+qty);
  saveDB();
  return {delivery: del};
}

function confirmPicking(delId, pickedQty){
  const del = DB.deliveries.find(d=>d.id===delId);
  if(!del) return {error:'Delivery not found.'};
  if(pickedQty < 0) return {error:'Picked quantity cannot be negative.'};
  if(pickedQty > del.quantity) return {error:'Picked quantity cannot exceed delivery quantity.'};
  del.pickedQty = pickedQty;
  del.pickingStatus = pickedQty >= del.quantity ? 'Completed' : (pickedQty>0 ? 'In Progress' : 'Not Started');
  if(del.pickingStatus==='Completed') del.status = 'Picked';
  addAudit(del, `Picking updated: ${pickedQty}/${del.quantity}`);
  saveDB();
  return {delivery: del};
}
function resetPicking(delId){
  const del = DB.deliveries.find(d=>d.id===delId); if(!del) return;
  del.pickedQty = 0; del.pickingStatus='Not Started'; if(del.status==='Picked') del.status='Created';
  addAudit(del, 'Picking reset'); saveDB();
}

function postGoodsIssue(delId){
  const del = DB.deliveries.find(d=>d.id===delId);
  if(!del) return {error:'Delivery not found.'};
  if(del.pickingStatus !== 'Completed') return {error:'Picking must be completed before PGI.'};
  if(del.pgiStatus === 'Completed') return {error:'PGI has already been posted for this delivery.'};
  const mat = findMaterial(del.materialId);
  if(!mat) return {error:'Material not found.'};
  if(mat.stock < del.quantity) return {error:'Insufficient stock to post goods issue.'};
  mat.stock -= del.quantity;
  const matDocId = nextId('MATDOC','matdoc');
  const matDoc = {
    id: matDocId, deliveryId: del.id, materialId: mat.id, quantity: del.quantity,
    movementType:'601 - Goods Issue for Delivery', postedAt: todayISO(), postedBy:'Sales User'
  };
  DB.materialDocs.push(matDoc);
  del.pgiStatus = 'Completed';
  del.status = 'PGI Completed';
  del.materialDocId = matDocId;
  addAudit(del, 'PGI posted, Material Doc '+matDocId);
  const so = DB.salesOrders.find(s=>s.id===del.salesOrderId);
  if(so){ addAudit(so, 'PGI posted for delivery '+del.id); }
  saveDB();
  return {delivery: del, materialDoc: matDoc};
}

function createInvoice(delId){
  const del = DB.deliveries.find(d=>d.id===delId);
  if(!del) return {error:'Delivery not found.'};
  if(del.pgiStatus !== 'Completed') return {error:'Billing cannot be created because Post Goods Issue is not completed.'};
  if(del.invoiceId) return {error:'An invoice already exists for this delivery.'};
  const so = DB.salesOrders.find(s=>s.id===del.salesOrderId);
  const calc = calcLine(del.quantity, so.unitPrice, so.discountPct||0, so.taxPct||0);
  const id = nextId('INV','inv');
  const days = termDays(so.paymentTerms);
  const inv = Object.assign({
    id, salesOrderId: so.id, deliveryId: del.id, customerId: so.customerId, materialId: so.materialId,
    quantity: del.quantity, billingDate: todayISO(), dueDate: addDays(todayISO(), days),
    currency: so.currency, paymentTerms: so.paymentTerms,
    paidAmount: 0, status: 'Open', createdAt: todayISO()
  }, calc);
  addAudit(inv, 'Created');
  DB.invoices.push(inv);
  del.invoiceId = id;
  so.status = 'Billing Created';
  addAudit(so, 'Invoice '+id+' created');
  saveDB();
  return {invoice: inv};
}

function recordPayment(invId, amount, method, refNo, notes){
  const inv = DB.invoices.find(i=>i.id===invId);
  if(!inv) return {error:'Payment cannot be recorded because no invoice exists.'};
  const remaining = inv.net - inv.paidAmount;
  if(amount <= 0) return {error:'Payment amount must be greater than zero.'};
  if(amount > remaining + 0.01) return {error:'Payment amount exceeds outstanding amount.'};
  const id = nextId('PAY','pay');
  const pay = {
    id, invoiceId: inv.id, paymentDate: todayISO(), amount, method, refNo: refNo||'', notes: notes||'',
    createdAt: todayISO()
  };
  DB.payments.push(pay);
  inv.paidAmount += amount;
  inv.status = inv.paidAmount >= inv.net - 0.01 ? 'Paid' : 'Partially Paid';
  addAudit(inv, `Payment ${id} recorded: ${fmtMoney(amount, inv.currency)}`);
  if(inv.status === 'Paid'){
    const so = DB.salesOrders.find(s=>s.id===inv.salesOrderId);
    if(so){ so.status = 'Completed'; addAudit(so, 'Order completed - invoice paid in full'); }
  }
  saveDB();
  return {payment: pay};
}

function isOverdue(inv){
  return inv.status !== 'Paid' && new Date(inv.dueDate) < new Date();
}

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  NAV_ITEMS.forEach(item=>{
    if(item.sec){ nav.appendChild(el(`<div class="nav-sec">${item.sec}</div>`)); return; }
    const div = el(`<div class="nav-item" data-view="${item.id}"><span class="ic">${item.ic}</span><span class="label">${item.label}</span></div>`);
    if(VIEW.name === item.id) div.classList.add('active');
    div.addEventListener('click', ()=> navigate(item.id));
    nav.appendChild(div);
  });
}

function navigate(name, params, opts){
  opts = opts || {};
  const next = {name, params: params||{}};
  const isSame = VIEW.name===next.name && JSON.stringify(VIEW.params)===JSON.stringify(next.params);
  if(!opts.replace && !opts.isBack && !isSame){
    NAV_STACK.push(VIEW);
  }
  VIEW = next;
  if(!opts.isBack && !isSame){
    try{ history.pushState(next, ''); }catch(e){}
  }
  renderNav();
  renderView();
  document.getElementById('content').scrollTop = 0;
}

window.addEventListener('popstate', (e)=>{
  const state = e.state || {name:'dashboard', params:{}};
  if(NAV_STACK.length) NAV_STACK.pop();
  VIEW = state;
  renderNav();
  renderView();
});

function goBack(){
  if(NAV_STACK.length > 0){
    const prev = NAV_STACK.pop();
    navigate(prev.name, prev.params, {isBack:true});
  } else {
    navigate('dashboard', {}, {isBack:true});
  }
}

}

    billing: renderBilling, payments: renderPayments, docflow: renderDocFlow,
    orderhistory: renderOrderHistory, reports: renderReports, settings: renderSettings,
    customerDetail: renderCustomerDetail, materialDetail: renderMaterialDetail, salesOrderDetail: renderSalesOrderDetail,
    quotationDetail: renderQuotationDetail, inquiryDetail: renderInquiryDetail,
    deliveryDetail: renderDeliveryDetail, invoiceDetail: renderInvoiceDetail,
  };
  const fn = renderers[VIEW.name] || renderDashboard;
  c.innerHTML = fn(VIEW.params||{});
  bindViewEvents();
}

/* ---------------- Dashboard ---------------- */
function renderDashboard(){
  const totalCustomers = DB.customers.length;
  const openQuotations = DB.quotations.filter(q=>['Draft','Active'].includes(q.status)).length;
  const openSO = DB.salesOrders.filter(s=>!['Completed','Cancelled'].includes(s.status)).length;
  const pendingDeliveries = DB.deliveries.filter(d=>d.pgiStatus!=='Completed').length;
  const pgiCompleted = DB.deliveries.filter(d=>d.pgiStatus==='Completed').length;
  const openInvoices = DB.invoices.filter(i=>i.status!=='Paid').length;
  const paymentsReceived = DB.payments.reduce((s,p)=>s+p.amount,0);
  const totalSalesValue = DB.salesOrders.reduce((s,o)=>s+o.net,0);

  const kpis = [
    ['dashboard-c-customers', totalCustomers, 'Total Customers', 'customers'],
    ['dashboard-c-inq', openQuotations, 'Open Quotations', 'quotations'],
    ['dashboard-c-so', openSO, 'Open Sales Orders', 'salesorders'],
    ['dashboard-c-del', pendingDeliveries, 'Pending Deliveries', 'deliveries'],
    ['dashboard-c-pgi', pgiCompleted, 'Goods Issues Completed', 'pgi'],
    ['dashboard-c-inv', openInvoices, 'Open Invoices', 'billing'],
    ['dashboard-c-pay', fmtMoney(paymentsReceived), 'Payments Received', 'payments'],
    ['dashboard-c-tot', fmtMoney(totalSalesValue), 'Total Sales Value', 'salesorders'],
  ];

  return `
    <h1 class="page-title">Order-to-Cash Dashboard</h1>
    <p class="page-sub">Real-time overview of the sales order lifecycle across SD, MM and FI.</p>
    <div class="kpi-grid">
      ${kpis.map(([id,v,l,dest])=>`<div class="kpi" data-nav="${dest}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('')}
    </div>
    <div class="card">
      <h3>Order-to-Cash Process Pipeline</h3>
      <div class="pipeline">
        ${['Customer|customers','Inquiry|inquiries','Quotation|quotations','Sales Order|salesorders','Delivery|deliveries','Picking|picking','PGI|pgi','Billing|billing','Payment|payments','Completed|orderhistory']
          .map((s,i,arr)=>{ const [label,dest]=s.split('|'); return `<span class="pipe-stage" data-nav="${dest}">${label}</span>${i<arr.length-1?'<span class="pipe-arrow">→</span>':''}`; }).join('')}
      </div>
    </div>
    <div class="card">
      <h3>Recent Sales Orders</h3>
      ${renderMiniOrderTable(DB.salesOrders.slice(-5).reverse())}
    </div>
  `;
}
function renderMiniOrderTable(orders){
  if(orders.length===0) return emptyState('No sales orders yet.', 'Create your first sales order from a quotation or directly.');
  return `<div class="table-wrap"><table class="grid"><thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Net Value</th><th>Status</th></tr></thead><tbody>
    ${orders.map(o=>`<tr><td><span class="cell-link" data-nav="salesOrderDetail" data-id="${o.id}">${o.id}</span></td><td>${escapeHtml(custName(o.customerId))}</td><td>${fmtDate(o.createdAt)}</td><td>${fmtMoney(o.net,o.currency)}</td><td>${statusBadge(o.status)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function custName(id){ const c = findCustomer(id); return c ? c.name+' ('+c.id+')' : id; }
function matName(id){ const m = findMaterial(id); return m ? m.description+' ('+m.id+')' : id; }
function emptyState(msg, sub, actionHtml){
  return `<div class="empty-state"><div class="ic">▢</div><div class="msg"><strong>${escapeHtml(msg)}</strong><br><span class="muted">${escapeHtml(sub||'')}</span></div>${actionHtml||''}</div>`;

function openCustomerForm(existingId){
  const existing = existingId ? findCustomer(existingId) : null;
  const returnToSalesOrder = !existingId && document.getElementById('so-form');

  openModal(existing? 'Edit Customer '+existing.id : 'Create Customer', customerFormHtml(existing), [
    {label:'Cancel', onClick: closeModal},
    {label: existing?'Save Changes':'Create Customer', cls:'primary', onClick: ()=>{
      const form = document.getElementById('customer-form');
      if(!form.reportValidity()) return;

      const data = readForm(form);
      data.creditLimit = Number(data.creditLimit)||0;

      if(existing){
        updateCustomer(existing.id, data);
        toast('Customer '+existing.id+' updated.', 'success');
        closeModal();
        navigate('customerDetail', {id: existing.id});
      }else{
        const c = createCustomer(data);

        navigate('customerDetail', {id: c.id});
      }
    }}
  ], true);
}

  openModal('Create Sales Order', salesOrderFormHtml(), [
    {label:'Cancel', onClick: closeModal},

      const form = document.getElementById('so-form');
      if(!form.reportValidity()) return;
      const data = readForm(form);
      data.quantity = Number(data.quantity); data.unitPrice = Number(data.unitPrice);
      data.discountPct = Number(data.discountPct); data.taxPct = Number(data.taxPct);
      if(!findCustomer(data.customerId)){ toast('Customer master record not found.','error'); return; }

  ]);

      newCustomerBtn.addEventListener('click', ()=>{
        openCustomerForm();
      });

    const sel = document.getElementById('so-material');
    const note = document.getElementById('so-stock-note');
    function update(){
      const opt = sel.selectedOptions[0];
      document.getElementById('so-price').value = opt.dataset.price;
      const stock = Number(opt.dataset.stock);
      const qty = Number(document.getElementById('so-qty').value)||0;

    sel.addEventListener('change', update);
    document.getElementById('so-qty').addEventListener('input', update);
    update();
  },0);
}

/* ---------------- Document Flow ---------------- */
function renderDocFlow(params){
  const soId = params.so || (DB.salesOrders.length ? DB.salesOrders[DB.salesOrders.length-1].id : null);
  return `
    <h1 class="page-title">Document Flow</h1>
    <p class="page-sub">Trace a transaction end-to-end: Inquiry → Quotation → Sales Order → Delivery → Picking → PGI → Billing → Payment.</p>
    <div class="card">
      <div class="field" style="max-width:340px;margin-bottom:16px"><label>Select Sales Order</label>
        <select id="docflow-so-select">${DB.salesOrders.slice().reverse().map(o=>`<option value="${o.id}" ${o.id===soId?'selected':''}>${o.id} — ${escapeHtml(custName(o.customerId))}</option>`).join('')}</select>
      </div>
      ${soId ? docFlowChain(soId) : emptyState('No sales orders yet.','Create a sales order to see its document flow.')}
    </div>
  `;
}
function docFlowChain(soId){
  const so = DB.salesOrders.find(s=>s.id===soId);
  if(!so) return emptyState('Sales order not found.','');
  const qt = so.quotationId ? DB.quotations.find(q=>q.id===so.quotationId) : null;
  const inq = qt && qt.inquiryId ? DB.inquiries.find(i=>i.id===qt.inquiryId) : null;
  const deliveries = DB.deliveries.filter(d=>d.salesOrderId===so.id);
  const nodes = [];
  nodes.push(inq ? node('Inquiry', inq.id, inq.status, 'inquiryDetail') : nodeEmpty('Inquiry'));
  nodes.push(qt ? node('Quotation', qt.id, qt.status, 'quotationDetail') : nodeEmpty('Quotation'));
  nodes.push(node('Sales Order', so.id, so.status, 'salesOrderDetail'));
  let flowHtml = `<div class="flow-chain">${nodes.map((n,i)=> i===0? n : `<span class="flow-arrow-v">→</span>${n}`).join('')}</div>`;

  if(deliveries.length===0){
    flowHtml += `<div class="flow-chain"><span class="flow-arrow-v">↓</span>${nodeEmpty('Delivery')}</div>`;
  } else {
    deliveries.forEach(d=>{
      const inv = d.invoiceId ? DB.invoices.find(i=>i.id===d.invoiceId) : null;
      const pays = inv ? DB.payments.filter(p=>p.invoiceId===inv.id) : [];
      const rowNodes = [
        node('Delivery', d.id, d.status, 'deliveryDetail'),
        node('Picking', d.id, d.pickingStatus, 'deliveryDetail'),
        inv ? node('Billing', inv.id, inv.status, 'invoiceDetail') : nodeEmpty('Billing'),
      ];
      flowHtml += `<div class="flow-chain">${rowNodes.map((n,i)=> i===0? n : `<span class="flow-arrow-v">→</span>${n}`).join('')}</div>`;
      if(pays.length){
        flowHtml += `<div class="flow-chain">${pays.map((p,i)=> (i===0?'<span class="flow-arrow-v">↳</span>':'') + node('Payment', p.id, 'Recorded', 'invoiceDetail', inv.id)).join('')}</div>`;
      } else if(inv){
        flowHtml += `<div class="flow-chain"><span class="flow-arrow-v">↳</span>${nodeEmpty('Payment')}</div>`;
      }
    });
  }
  return flowHtml;
}
function node(type, id, status, navName, overrideId){
  return `<div class="flow-node" data-nav="${navName}" data-id="${overrideId||id}"><div class="fn-t">${type}</div><div class="fn-id">${id}</div><div class="fn-s">${statusBadge(status)}</div></div>`;
}
function nodeEmpty(type){
  return `<div class="flow-node empty"><div class="fn-t">${type}</div><div class="fn-id">—</div><div class="fn-s">${badge('Not Created','grey')}</div></div>`;
}

      </select>

function orderHistoryRows(list){
  if(list.length===0) return `<tr><td colspan="8">${emptyState('No orders yet.','')}</td></tr>`;
  return list.slice().reverse().map(o=>{
    const deliveries = DB.deliveries.filter(d=>d.salesOrderId===o.id);
    const delivered = deliveries.some(d=>d.pgiStatus==='Completed');
    const latestDelivery = deliveries[deliveries.length-1] || null;
    const invs = deliveries.map(d=>d.invoiceId).filter(Boolean).map(id=>DB.invoices.find(i=>i.id===id)).filter(Boolean);
    const latestInvoice = invs[invs.length-1] || null;
    const billed = invs.length>0;
    const paid = invs.length>0 && invs.every(i=>i.status==='Paid');

    // Each Order History status is now a direct link to the next/current process step.
    // If the next document does not exist yet, take the user back to the Sales Order
    // where the next action (for example Create Delivery) is available.
    const deliveryLink = delivered && latestDelivery
      ? `<span class="cell-link" data-nav="deliveryDetail" data-id="${latestDelivery.id}">${statusBadge('Fully Delivered')}</span>`
      : `<span class="cell-link" data-nav="salesOrderDetail" data-id="${o.id}">${statusBadge('Not Created')}</span>`;

    const billingLink = billed && latestInvoice
      ? `<span class="cell-link" data-nav="invoiceDetail" data-id="${latestInvoice.id}">${statusBadge('Billing Created')}</span>`
      : `<span class="cell-link" data-nav="salesOrderDetail" data-id="${o.id}">${statusBadge('Not Created')}</span>`;

    const paymentLink = latestInvoice
      ? `<span class="cell-link" data-nav="invoiceDetail" data-id="${latestInvoice.id}">${paid?statusBadge('Paid'):statusBadge('Open')}</span>`
      : `<span class="cell-link" data-nav="salesOrderDetail" data-id="${o.id}">${statusBadge('Open')}</span>`;

    return `<tr>
      <td><span class="cell-link" data-nav="salesOrderDetail" data-id="${o.id}">${o.id}</span></td>
      <td>${escapeHtml(custName(o.customerId))}</td><td>${fmtDate(o.createdAt)}</td><td>${fmtMoney(o.net,o.currency)}</td>
      <td>${deliveryLink}</td>
      <td>${billingLink}</td>
      <td>${paymentLink}</td>
      <td><span class="cell-link" data-nav="salesOrderDetail" data-id="${o.id}">${statusBadge(o.status)}</span></td>
    </tr>`;
  }).join('');
}

/* ---------------- Reports ---------------- */
function renderReports(){
  const totalOrders = DB.salesOrders.length;
  const totalSales = DB.salesOrders.reduce((s,o)=>s+o.net,0);
  const avgOrder = totalOrders ? totalSales/totalOrders : 0;
  const custTotals = {};
  DB.salesOrders.forEach(o=>{ custTotals[o.customerId] = (custTotals[o.customerId]||0) + o.net; });
  const topCustomers = Object.entries(custTotals).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const matTotals = {};
  DB.salesOrders.forEach(o=>{ matTotals[o.materialId] = (matTotals[o.materialId]||0) + o.quantity; });
  const topMaterials = Object.entries(matTotals).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxCust = Math.max(1, ...topCustomers.map(c=>c[1]));
  const maxMat = Math.max(1, ...topMaterials.map(m=>m[1]));

  const pendingDel = DB.deliveries.filter(d=>d.pgiStatus!=='Completed').length;
  const completedDel = DB.deliveries.filter(d=>d.pgiStatus==='Completed').length;
  const delayedDel = DB.salesOrders.filter(o=> o.availabilityCheck && o.availabilityCheck.backorderQty>0 && o.status!=='Fully Delivered' && o.status!=='Completed').length;

  const totalBilling = DB.invoices.reduce((s,i)=>s+i.net,0);
  const openInv = DB.invoices.filter(i=>i.status!=='Paid').length;
  const paidInv = DB.invoices.filter(i=>i.status==='Paid').length;
  const overdueInv = DB.invoices.filter(isOverdue).length;

  const totalPayments = DB.payments.reduce((s,p)=>s+p.amount,0);
  const pendingPayments = DB.invoices.filter(i=>i.status==='Open').length;
  const partialPayments = DB.invoices.filter(i=>i.status==='Partially Paid').length;
  const completedPayments = DB.invoices.filter(i=>i.status==='Paid').length;

  return `
    <h1 class="page-title">Reports</h1>
    <p class="page-sub">Analytical view across sales, delivery, billing and payments.</p>
    <div class="card"><h3>Sales Report</h3>
      <div class="stat-line"><span class="l">Total Orders</span><span class="v">${totalOrders}</span></div>
      <div class="stat-line"><span class="l">Total Sales</span><span class="v">${fmtMoney(totalSales)}</span></div>
      <div class="stat-line"><span class="l">Average Order Value</span><span class="v">${fmtMoney(avgOrder)}</span></div>
      <div class="section-title">Top Customers</div>
      ${topCustomers.length===0? '<p class="muted">No data yet.</p>' : topCustomers.map(([id,val])=>`<div class="bar-row"><span class="name">${escapeHtml(custName(id))}</span><div class="bar-track"><div class="bar-fill" style="width:${(val/maxCust*100)}%"></div></div><span class="bar-val">${fmtMoney(val)}</span></div>`).join('')}
      <div class="section-title">Top Materials (by Qty)</div>
      ${topMaterials.length===0? '<p class="muted">No data yet.</p>' : topMaterials.map(([id,val])=>`<div class="bar-row"><span class="name">${escapeHtml(matName(id))}</span><div class="bar-track"><div class="bar-fill" style="width:${(val/maxMat*100)}%"></div></div><span class="bar-val">${val} units</span></div>`).join('')}
    </div>
    <div class="card"><h3>Delivery Report</h3>
      <div class="stat-line"><span class="l">Pending Deliveries</span><span class="v">${pendingDel}</span></div>
      <div class="stat-line"><span class="l">Completed Deliveries</span><span class="v">${completedDel}</span></div>
      <div class="stat-line"><span class="l">Delayed Deliveries (Backorder)</span><span class="v">${delayedDel}</span></div>
    </div>
    <div class="card"><h3>Billing Report</h3>
      <div class="stat-line"><span class="l">Total Billing</span><span class="v">${fmtMoney(totalBilling)}</span></div>
      <div class="stat-line"><span class="l">Open Invoices</span><span class="v">${openInv}</span></div>
      <div class="stat-line"><span class="l">Paid Invoices</span><span class="v">${paidInv}</span></div>
      <div class="stat-line"><span class="l">Overdue Invoices</span><span class="v">${overdueInv}</span></div>
    </div>
    <div class="card"><h3>Payment Report</h3>
      <div class="stat-line"><span class="l">Total Payments Received</span><span class="v">${fmtMoney(totalPayments)}</span></div>
      <div class="stat-line"><span class="l">Pending (Open) Invoices</span><span class="v">${pendingPayments}</span></div>
      <div class="stat-line"><span class="l">Partial Payments</span><span class="v">${partialPayments}</span></div>
      <div class="stat-line"><span class="l">Fully Paid</span><span class="v">${completedPayments}</span></div>
    </div>
  `;
}

/* =========================================================================
   EVENT BINDING
   ========================================================================= */
function bindViewEvents(){
  const content = document.getElementById('content');

  content.querySelectorAll('[data-nav]').forEach(elm=>{
    elm.addEventListener('click', ()=>{
      const name = elm.dataset.nav;
      const id = elm.dataset.id;
      navigate(name, id ? {id} : {});
    });
  });
  const backBtn = document.getElementById('btn-back');
  if(backBtn) backBtn.addEventListener('click', goBack);

  // Customers
  const newCust = document.getElementById('btn-new-customer'); if(newCust) newCust.addEventListener('click', ()=>openCustomerForm());
  content.querySelectorAll('[data-action=edit-customer]').forEach(b=>b.addEventListener('click', ()=>openCustomerForm(b.dataset.id)));
  const toggleActive = document.getElementById('btn-toggle-active');
  if(toggleActive) toggleActive.addEventListener('click', ()=>{ toggleCustomerActive(VIEW.params.id); renderView(); });
  // Customer search: keep filtering local instead of rebinding the entire view.
  // The old implementation called bindViewEvents() after every keystroke, which
  // repeatedly attached click/input handlers and could make Clear behave inconsistently.
  const custSearch = document.getElementById('cust-search');
  const custFilter = document.getElementById('cust-filter');
  const custClear = document.getElementById('cust-clear');
  const custSearchBox = custSearch ? custSearch.closest('.customer-search-box') : null;

  function applyCustomerSearch(){
    if(!custSearch || !custFilter) return;

    const q = custSearch.value.trim().toLowerCase();
    const filterVal = custFilter.value;

    let list = DB.customers.filter(c=>{
      const name = String(c.name || '').toLowerCase();
      const id = String(c.id || '').toLowerCase();
      return !q || name.includes(q) || id.includes(q);
    });

    if(filterVal==='active') list = list.filter(c=>c.active);
    if(filterVal==='inactive') list = list.filter(c=>!c.active);

    const tbody = document.querySelector('#cust-table tbody');
    if(tbody){
      tbody.innerHTML = custRows(list);
      tbody.querySelectorAll('[data-nav]').forEach(elm=>{
        elm.addEventListener('click', ()=>{
          const name = elm.dataset.nav;
          const id = elm.dataset.id;
          navigate(name, id ? {id} : {});
        });
      });
      tbody.querySelectorAll('[data-action=edit-customer]').forEach(b=>{
        b.addEventListener('click', ()=>openCustomerForm(b.dataset.id));
      });
    }

    if(custSearchBox){
      custSearchBox.classList.toggle('has-value', Boolean(q));
    }
  }

  if(custSearch) custSearch.addEventListener('input', applyCustomerSearch);
  if(custFilter) custFilter.addEventListener('change', applyCustomerSearch);

  if(custClear) custClear.addEventListener('click', ()=>{
    custSearch.value = '';
    custFilter.value = 'all';
    applyCustomerSearch();
    custSearch.focus();
  });

  // Keep the clear icon in the correct initial state.
  if(custSearchBox){
    custSearchBox.classList.toggle('has-value', Boolean(custSearch && custSearch.value.trim()));
  }

  // Materials
  const newMat = document.getElementById('btn-new-material'); if(newMat) newMat.addEventListener('click', ()=>openMaterialForm());
  content.querySelectorAll('[data-action=edit-material]').forEach(b=>b.addEventListener('click', ()=>openMaterialForm(b.dataset.id)));
  const matSearch = document.getElementById('mat-search');
  const matClear = document.getElementById('mat-clear');
  const matSearchBox = matSearch ? matSearch.closest('.customer-search-box') : null;

  function bindMaterialRows(tbody){
    if(!tbody) return;
    tbody.querySelectorAll('[data-nav]').forEach(elm=>{
      elm.addEventListener('click', ()=>{
        const name = elm.dataset.nav;
        const id = elm.dataset.id;
        navigate(name, id ? {id} : {});
      });
    });
    tbody.querySelectorAll('[data-action=edit-material]').forEach(b=>{
      b.addEventListener('click', ()=>openMaterialForm(b.dataset.id));
    });
  }

  function applyMaterialSearch(){
    if(!matSearch) return;
    const q = matSearch.value.trim().toLowerCase();
    const list = DB.materials.filter(m=>{
      const fields = [m.id,m.description,m.searchTerm,m.type,m.plant,m.category,m.baseUOM,m.salesUnit,m.storageLoc].map(v=>String(v||'').toLowerCase());
      return !q || fields.some(v=>v.includes(q));
    });
    const tbody = document.querySelector('#mat-table tbody');
    if(tbody){
      tbody.innerHTML = matRows(list);
      bindMaterialRows(tbody);
    }
    if(matSearchBox){
      matSearchBox.classList.toggle('has-value', Boolean(q));
    }
  }
  if(matSearch) matSearch.addEventListener('input', applyMaterialSearch);
  if(matClear) matClear.addEventListener('click', ()=>{
    if(!matSearch) return;
    matSearch.value='';
    applyMaterialSearch();
    matSearch.focus();
  });
  if(matSearchBox){
    matSearchBox.classList.toggle('has-value', Boolean(matSearch && matSearch.value.trim()));
  }

  // Inquiries
  const newInq = document.getElementById('btn-new-inquiry'); if(newInq) newInq.addEventListener('click', openInquiryForm);
  content.querySelectorAll('[data-action=convert-inquiry]').forEach(b=>b.addEventListener('click', ()=>{
    const inq = DB.inquiries.find(i=>i.id===b.dataset.id);
    const mat = findMaterial(inq.materialId);
    confirmDialog(`Convert Inquiry ${inq.id} to a Quotation? Customer and material details will be copied automatically.`, ()=>{
      const qt = convertInquiryToQuotation(inq.id, {unitPrice: mat.standardPrice, discountPct:0, taxPct:18, paymentTerms:'Z030', incoterms:INCOTERMS[0], currency:'INR'});
      toast('Quotation '+qt.id+' created from '+inq.id+'.','success');
      navigate('quotationDetail', {id: qt.id});
    }, {confirmLabel:'Convert to Quotation'});
  }));

  // Quotations
  const newQt = document.getElementById('btn-new-quotation'); if(newQt) newQt.addEventListener('click', openQuotationForm);
  content.querySelectorAll('[data-action=accept-quotation]').forEach(b=>b.addEventListener('click', ()=>{ setQuotationStatus(b.dataset.id,'Accepted'); toast('Quotation '+b.dataset.id+' accepted.','success'); renderView(); }));
  content.querySelectorAll('[data-action=convert-quotation]').forEach(b=>b.addEventListener('click', ()=>{
    const qt = DB.quotations.find(q=>q.id===b.dataset.id);
    confirmDialog(`Create a Sales Order from Quotation ${qt.id}? Pricing and customer data will be copied.`, ()=>{
      const so = convertQuotationToSalesOrder(qt.id, {requestedDeliveryDate: addDays(todayISO(),7)});
      toast('Sales Order '+so.id+' created from '+qt.id+'.','success');
      navigate('salesOrderDetail', {id: so.id});
    }, {confirmLabel:'Create Sales Order'});
  }));

  // Sales Orders
  const newSO = document.getElementById('btn-new-so'); if(newSO) newSO.addEventListener('click', openSalesOrderForm);
  content.querySelectorAll('[data-action=create-delivery]').forEach(b=>b.addEventListener('click', ()=>openDeliveryForm(b.dataset.so)));
  content.querySelectorAll('[data-action=show-docflow]').forEach(b=>b.addEventListener('click', ()=>navigate('docflow',{so:b.dataset.so})));

  // Deliveries
  const newDel = document.getElementById('btn-new-delivery'); if(newDel) newDel.addEventListener('click', ()=>openDeliveryForm());
  content.querySelectorAll('[data-action=confirm-picking]').forEach(b=>b.addEventListener('click', ()=>{
    const input = document.getElementById('pick-qty-'+b.dataset.id);
    const qty = Number(input.value);
    const res = confirmPicking(b.dataset.id, qty);
    if(res.error){ toast(res.error,'error'); return; }
    toast('Picking updated for '+b.dataset.id+'.','success');
    renderView();
  }));
  content.querySelectorAll('[data-action=reset-picking]').forEach(b=>b.addEventListener('click', ()=>{ resetPicking(b.dataset.id); toast('Picking reset.','info'); renderView(); }));
  content.querySelectorAll('[data-action=post-pgi]').forEach(b=>b.addEventListener('click', ()=>{
    confirmDialog('Are you sure you want to post goods issue? This will reduce inventory and cannot be undone.', ()=>{
      const res = postGoodsIssue(b.dataset.id);
      if(res.error){ toast(res.error,'error'); return; }
      toast('PGI posted. Material Document: '+res.materialDoc.id,'success');
      renderView();
    }, {confirmLabel:'Post Goods Issue'});
  }));

  // Billing
  content.querySelectorAll('[data-action=create-invoice]').forEach(b=>b.addEventListener('click', ()=>{
    const res = createInvoice(b.dataset.id);
    if(res.error){ toast(res.error,'error'); return; }
    toast('Invoice '+res.invoice.id+' created.','success');
    navigate('invoiceDetail', {id: res.invoice.id});
  }));

  // Payments
  content.querySelectorAll('[data-action=record-payment]').forEach(b=>b.addEventListener('click', ()=>openPaymentForm(b.dataset.id)));

  // Document flow select
  const dfSel = document.getElementById('docflow-so-select');
  if(dfSel) dfSel.addEventListener('change', e=> navigate('docflow', {so: e.target.value}));

  // KPI / pipeline nav
  content.querySelectorAll('[data-nav]').forEach(elm=>{}); // already bound above generically

  // Order history filters
  const ohSearch = document.getElementById('oh-search');
  const ohFilter = document.getElementById('oh-filter');
  function applyOH(){
    let list = DB.salesOrders;
    const q = ohSearch ? ohSearch.value.toLowerCase() : '';
    if(q) list = list.filter(o=> o.id.toLowerCase().includes(q) || custName(o.customerId).toLowerCase().includes(q));
    const f = ohFilter ? ohFilter.value : 'all';
    if(f==='open') list = list.filter(o=>o.status==='Created');
    if(f==='progress') list = list.filter(o=>['Confirmed','Partially Delivered'].includes(o.status));
    if(f==='delivered') list = list.filter(o=>o.status==='Fully Delivered');
    if(f==='billed') list = list.filter(o=>o.status==='Billing Created');
    if(f==='paid') list = list.filter(o=>o.status==='Completed');
    if(f==='cancelled') list = list.filter(o=>o.status==='Cancelled');
    document.querySelector('#oh-table tbody').innerHTML = orderHistoryRows(list);
    bindViewEvents();
  }
  if(ohSearch) ohSearch.addEventListener('input', applyOH);
  if(ohFilter) ohFilter.addEventListener('change', applyOH);
  const ohClear = document.getElementById('oh-clear');
  if(ohClear) ohClear.addEventListener('click', ()=>{ if(ohSearch) ohSearch.value=''; if(ohFilter) ohFilter.value='all'; applyOH(); });

  // Settings
  const loadDemoBtn = document.getElementById('btn-load-demo');
  if(loadDemoBtn) loadDemoBtn.addEventListener('click', ()=>{
    confirmDialog('This will replace all current data with sample demo data. Continue?', ()=>{
      loadDemoData(); toast('Demo data loaded.','success'); navigate('dashboard');
    }, {confirmLabel:'Load Demo Data'});
  });
  const clearDemoBtn = document.getElementById('btn-clear-demo');
  if(clearDemoBtn) clearDemoBtn.addEventListener('click', ()=>{
    confirmDialog('This will permanently delete ALL data (customers, materials, orders, invoices, payments). Continue?', ()=>{
      clearDemoData(); toast('All data cleared.','info'); navigate('dashboard');
    }, {confirmLabel:'Clear All Data'});
  });
}

/* KPI / pipeline clicks (delegated at document level since dashboard re-renders) */
document.addEventListener('click', (e)=>{
  const navEl = e.target.closest('[data-nav]');
  if(navEl && document.getElementById('content').contains(navEl)){
    // handled in bindViewEvents already for elements inside content at render time;
    // this fallback covers dynamically inserted elements like KPI cards using data-nav without data-id
  }
});

/* ---------------- Global Search ---------------- */
function buildSearchIndex(){
  const idx = [];
  DB.customers.forEach(c=> idx.push({label:c.id+' — '+c.name, view:'customerDetail', id:c.id}));
  DB.materials.forEach(m=> idx.push({label:m.id+' — '+m.description, view:'materials', id:null}));
  DB.inquiries.forEach(i=> idx.push({label:i.id+' — Inquiry', view:'inquiryDetail', id:i.id}));
  DB.quotations.forEach(q=> idx.push({label:q.id+' — Quotation', view:'quotationDetail', id:q.id}));
  DB.salesOrders.forEach(o=> idx.push({label:o.id+' — Sales Order', view:'salesOrderDetail', id:o.id}));
  DB.deliveries.forEach(d=> idx.push({label:d.id+' — Delivery', view:'deliveryDetail', id:d.id}));
  DB.invoices.forEach(i=> idx.push({label:i.id+' — Invoice', view:'invoiceDetail', id:i.id}));
  DB.payments.forEach(p=> idx.push({label:p.id+' — Payment', view:'invoiceDetail', id:p.invoiceId}));
  return idx;
}
function setupGlobalSearch(){
  const input = document.getElementById('gsearch');
  let dropdown = null;
  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    if(dropdown){ dropdown.remove(); dropdown = null; }
    if(!q) return;
    SEARCH_INDEX = buildSearchIndex();
    const matches = SEARCH_INDEX.filter(item=> item.label.toLowerCase().includes(q)).slice(0,8);
    dropdown = document.createElement('div');
    dropdown.style.cssText = 'position:absolute;top:38px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,0.12);z-index:50;max-height:280px;overflow-y:auto';
    if(matches.length===0){
      dropdown.innerHTML = `<div style="padding:10px 14px;font-size:13px;color:var(--ink-50)">No results found.</div>`;
    } else {
      matches.forEach(m=>{
        const item = document.createElement('div');
        item.style.cssText = 'padding:9px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line)';
        item.textContent = m.label;
        item.addEventListener('mouseenter', ()=> item.style.background='var(--blue-10)');
        item.addEventListener('mouseleave', ()=> item.style.background='');
        item.addEventListener('click', ()=>{
          navigate(m.view, m.id?{id:m.id}:{});
          input.value=''; dropdown.remove(); dropdown=null;
        });
        dropdown.appendChild(item);
      });
    }
    input.parentElement.appendChild(dropdown);
  });
  document.addEventListener('click', (e)=>{
    if(dropdown && !input.parentElement.contains(e.target)){ dropdown.remove(); dropdown=null; }
  });
}

/* =========================================================================
   BOOT
   ========================================================================= */
async function boot(){
  document.getElementById('content').innerHTML = `<div class="empty-state"><div class="ic">⏳</div><div class="msg">Loading SAP SD Order-to-Cash Simulator...</div></div>`;
  const loaded = await loadDB();
  DB = loaded || emptyDB();
  if(!loaded){ loadDemoData(); }
  try{ history.replaceState(VIEW, ''); }catch(e){}
  renderNav();
  renderView();
  setupGlobalSearch();
}
boot();
</script>
